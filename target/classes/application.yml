server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  application:
    name: somehouse
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=Somehouse;encrypt=true;trustServerCertificate=true}
    username: ${DB_USER:somehouse_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
      data-source-properties:
        loginTimeout: 10
        socketTimeout: 15000
        sendStringParametersAsUnicode: true
  flyway:
    enabled: true
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jdbc:
    template:
      query-timeout: 10s
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  admin-email: ${APP_ADMIN_EMAIL:}
  admin-password: ${APP_ADMIN_PASSWORD:}
  seed-enabled: ${APP_SEED_ENABLED:true}
  upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
springdoc:
  swagger-ui:
    path: /api-docs.html
